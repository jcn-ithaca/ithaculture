<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ithaculture: what's on in Ithaca</title>
<meta name="description" content="Upcoming music, comedy, karaoke and films at Ithaca venues, refreshed every morning.">
<link rel="stylesheet" href="style.css?v=__VERSION__">
</head>
<body>
<header>
  <h1>Ithaculture</h1>
  <p class="tagline">What's on in Ithaca, gathered from venue websites every morning.</p>
</header>
<div class="layout">
  <aside class="panel">
    <h2 class="panel-label">Venues</h2>
    <nav class="filters" id="filters" aria-label="Filter by venue"></nav>
    <h2 class="panel-label">Days</h2>
    <nav class="filters days" id="day-filters" aria-label="Filter by day of the week"></nav>
    <p class="actions">
      <a href="ithaculture.ics">Subscribe (.ics)</a>
      <span id="updated"></span>
    </p>
  </aside>
  <main id="agenda"><p class="empty">Loading events…</p></main>
</div>
<footer>
  <p id="sources"></p>
  <p>Listings are copied automatically and may change; check the venue before you go.
  Source on <a href="https://github.com/jcn-ithaca/ithaculture">GitHub</a>.</p>
</footer>
<script src="app.js?v=__VERSION__"></script>
</body>
</html>
