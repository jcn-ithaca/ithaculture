<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ithaculture: what's on in Ithaca</title>
<meta name="description" content="Upcoming music, comedy, karaoke and films at Ithaca venues, refreshed every morning.">
<link rel="stylesheet" href="style.css?v=__VERSION__">
</head>
<body>
<header>
  <h1>Ithaculture</h1>
  <p class="tagline">What's on in Ithaca, gathered from venue websites every morning.</p>
</header>
<div class="layout">
  <div class="toolbar">
    <details class="menu" id="venue-menu">
      <summary>Venues: <span class="menu-state">All</span></summary>
      <div class="menu-panel">
        <div class="menu-bulk"><button type="button" data-all>All</button><button type="button" data-none>None</button></div>
        <div class="menu-list" id="filters" aria-label="Filter by venue"></div>
      </div>
    </details>
    <details class="menu" id="day-menu">
      <summary>Days: <span class="menu-state">All</span></summary>
      <div class="menu-panel">
        <div class="menu-bulk"><button type="button" data-all>All</button><button type="button" data-none>None</button><button type="button" data-weekend>Weekend</button></div>
        <div class="menu-list" id="day-filters" aria-label="Filter by day of the week"></div>
      </div>
    </details>
  </div>
  <p class="actions">
    <a href="ithaculture.ics">Subscribe (.ics)</a>
    <span id="updated"></span>
  </p>
  <main id="agenda"><p class="empty">Loading events…</p></main>
</div>
<footer>
  <p id="sources"></p>
  <p>Listings are copied automatically and may change; check the venue before you go.
  Source on <a href="https://github.com/jcn-ithaca/ithaculture">GitHub</a>.</p>
</footer>
<script src="app.js?v=__VERSION__"></script>
</body>
</html>
