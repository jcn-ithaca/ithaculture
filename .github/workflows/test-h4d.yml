name: Test Hands Four scraper (temporary)
on:
  push:
    branches: [claude/project-thread-rob5lc]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Scrape Hands Four only
        run: |
          python - <<'PY'
          import sys, json, pathlib
          sys.path.insert(0, "scraper")
          import scrape
          scrape.DEBUG_DIR = pathlib.Path("debug"); scrape.DEBUG_DIR.mkdir()
          for e in scrape.scrape_h4d():
              print(json.dumps(e))
          html = (scrape.DEBUG_DIR / "hands4dancers.html").read_text()
          i = html.find("eventlist-event")
          print("---- markup sample ----")
          print(html[i-200:i+4000])
          PY
