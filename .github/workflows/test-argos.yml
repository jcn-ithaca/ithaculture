name: Test Argos scraper (temporary)
on:
  push:
    branches: [claude/project-thread-k6romx]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Scrape Argos only
        run: |
          python - <<'PY'
          import sys, json, pathlib
          sys.path.insert(0, "scraper")
          import scrape
          scrape.DEBUG_DIR = pathlib.Path("debug"); scrape.DEBUG_DIR.mkdir()
          try:
              for e in scrape.scrape_argos():
                  print(json.dumps(e))
          finally:
              from bs4 import BeautifulSoup
              soup = BeautifulSoup((scrape.DEBUG_DIR / "argos.html").read_text(), "html.parser")
              for t in soup(["script", "style", "noscript"]): t.decompose()
              print("---- page text ----")
              for t in soup.get_text("\n").split("\n"):
                  t = " ".join(t.split())
                  if t: print(t)
              print("---- imgs/links ----")
              for i in soup.find_all(["img", "a"]):
                  print(i.name, i.get("src") or i.get("href"), "|", i.get_text(" ", strip=True)[:40])
          PY
